spring.datasource.url=jdbc:h2:mem:uniform_management_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

security.jwt.secret=UniformManagementTestJwtSecretKeyForH2ProfileMustBeLongEnough
security.jwt.expiration-minutes=60
uniform.ai.base-url=http://127.0.0.1:5999
uniform.ai.face-base-url=http://127.0.0.1:5999
uniform.ai.timeout-seconds=2
uniform.ai.output-root=
uniform.ai.allowed-image-extensions=jpg,jpeg,png
uniform.ai.image-backfill.enabled=false
uniform.ai.lightweight-endpoint=/api/ai/evaluate-student-lightweight
uniform.ai.realtime-endpoint=/api/realtime-camera/analyze-frame
uniform.ai.realtime-timeout-seconds=2
uniform.schedule.time-zone=Asia/Ho_Chi_Minh
app.admin.email=admin@test.local
app.admin.password=Admin@123456
