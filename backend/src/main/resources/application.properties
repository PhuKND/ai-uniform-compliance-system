spring.application.name=uniform-management
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/uniform_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh


spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


security.jwt.secret=${SECURITY_JWT_SECRET:uniform-local-jwt-secret-key-2026-minimum-32-bytes}
security.jwt.expiration-minutes=1440

uniform.ai.base-url=${UNIFORM_AI_BASE_URL:http://127.0.0.1:5001}
uniform.ai.face-base-url=${UNIFORM_AI_FACE_BASE_URL:http://127.0.0.1:5001}
uniform.ai.public-base-url=${UNIFORM_AI_PUBLIC_BASE_URL:}

uniform.ai.timeout-seconds=${UNIFORM_AI_TIMEOUT_SECONDS:300}
uniform.ai.advanced-evaluation-timeout-seconds=${UNIFORM_AI_ADVANCED_EVALUATION_TIMEOUT_SECONDS:300}

uniform.ai.yolov8-v2-endpoint=${UNIFORM_AI_YOLOV8_V2_ENDPOINT:/api/uniform/evaluate/yolov8-v2}
uniform.ai.grounding-dino-v2-endpoint=${UNIFORM_AI_GROUNDING_DINO_V2_ENDPOINT:/api/uniform/evaluate/grounding-dino-v2}
uniform.ai.lightweight-endpoint=${UNIFORM_AI_LIGHTWEIGHT_ENDPOINT:/api/ai/evaluate-student-lightweight}

uniform.ai.output-root=${UNIFORM_AI_OUTPUT_ROOT:}
uniform.ai.allowed-image-extensions=${UNIFORM_AI_ALLOWED_IMAGE_EXTENSIONS:jpg,jpeg,png}

uniform.ai.image-backfill.enabled=${UNIFORM_AI_IMAGE_BACKFILL_ENABLED:false}
uniform.ai.image-backfill.run-id=${UNIFORM_AI_IMAGE_BACKFILL_RUN_ID:0}


uniform.ai.realtime-endpoint=${UNIFORM_AI_REALTIME_ENDPOINT:/api/realtime-camera/analyze-frame}
uniform.ai.realtime-timeout-seconds=${UNIFORM_AI_REALTIME_TIMEOUT_SECONDS:10}

uniform.ai.realtime.yolov8-pose-model=${UNIFORM_AI_REALTIME_YOLOV8_POSE_MODEL:}
uniform.ai.realtime.yolov8-uniform-model=${UNIFORM_AI_REALTIME_YOLOV8_UNIFORM_MODEL:}
uniform.ai.realtime.insightface-config=${UNIFORM_AI_REALTIME_INSIGHTFACE_CONFIG:}
uniform.ai.realtime.face-embedding-source=${UNIFORM_AI_REALTIME_FACE_EMBEDDING_SOURCE:registered-face-data}

uniform.ai.realtime.confidence-threshold=${UNIFORM_AI_REALTIME_CONFIDENCE_THRESHOLD:0.35}
uniform.ai.realtime.face-threshold=${UNIFORM_AI_REALTIME_FACE_THRESHOLD:0.45}
uniform.ai.realtime.frame-size=${UNIFORM_AI_REALTIME_FRAME_SIZE:640}


uniform.schedule.time-zone=${UNIFORM_SCHEDULE_TIME_ZONE:Asia/Ho_Chi_Minh}


app.admin.email=${UNIFORM_ADMIN_EMAIL:}
app.admin.password=${UNIFORM_ADMIN_PASSWORD:}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://uniform.pawcarestore.online,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
